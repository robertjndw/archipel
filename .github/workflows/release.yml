name: Release

# Publishing a GitHub release (or prerelease) builds Archipel and attaches
# Archipel-<version>.dmg to it. Running the workflow by hand builds a DMG as a
# workflow artifact instead, without touching any release.
#
# Signing is optional: with the Developer ID secrets set the DMG is signed and
# notarized, without them it is signed ad-hoc. Only a notarized DMG is added to
# the Sparkle appcast, and only when SPARKLE_PRIVATE_KEY is set: the release gets
# an appcast-item.json with the update's signature, and pages.yml deploys the
# feed. A prerelease goes to the beta channel, a normal release to everyone.
# See docs/releasing.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    # The app targets macOS 27, which needs Xcode 27. The macos-26 images don't have it.
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      publish-appcast: ${{ steps.version.outputs.publish-appcast }}
    # Spelled out because only an explicit bash shell gets pipefail. Without it a failed
    # build-dmg.sh piped into tail would let the step pass.
    defaults:
      run:
        shell: bash
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      # Keep in step with MACOSX_DEPLOYMENT_TARGET, so Sparkle never offers an update
      # to a Mac that can't run it.
      MINIMUM_SYSTEM_VERSION: "27.0"
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          publish_appcast=false
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ ! "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
              echo "::error::Tag $TAG is not a version like v1.2.3 or v1.2.3-beta.1"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            # The app picks its default update channel from the suffix, so the two have to agree.
            if [[ "$PRERELEASE" == "true" && "$version" != *-* ]]; then
              echo "::error::Prereleases need a suffix such as v$version-beta.1"
              exit 1
            fi
            if [[ "$PRERELEASE" != "true" && "$version" == *-* ]]; then
              echo "::error::$TAG has a prerelease suffix but is not marked as a prerelease"
              exit 1
            fi
            if [[ "$HAS_SPARKLE_KEY" == "true" && "$HAS_DEVELOPER_ID" == "true" && "$HAS_NOTARY_KEY" == "true" ]]; then
              publish_appcast=true
            else
              echo "::warning::Not adding this release to the appcast. That needs SPARKLE_PRIVATE_KEY and the Developer ID and notarization secrets."
            fi
          else
            version="0.0.0-dev.${{ github.run_number }}"
          fi
          # Checked before the long build, since every update would fail verification on the Macs
          # that download it.
          if [[ "$publish_appcast" == "true" ]] && grep -q REPLACE_WITH_SPARKLE_PUBLIC_KEY Archipel/Info.plist; then
            echo "::error::Set SUPublicEDKey in Archipel/Info.plist, see docs/releasing.md"
            exit 1
          fi
          {
            echo "VERSION=$version"
            # CFBundleVersion has to grow with every build, and Sparkle compares it across both
            # channels. The run number does both.
            echo "BUILD=${{ github.run_number }}"
            echo "CHANNEL=$([[ "$PRERELEASE" == "true" ]] && echo beta)"
            echo "PUBLISH_APPCAST=$publish_appcast"
          } >> "$GITHUB_ENV"
          echo "publish-appcast=$publish_appcast" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Cache GhosttyKit
        id: ghostty-cache
        uses: actions/cache@v6
        with:
          path: |
            Packages/TerminalKit/Frameworks
            Vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-xcode-27.2-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Build GhosttyKit
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$TEAM_ID" ]]; then
            echo "::error::Set the APPLE_TEAM_ID repository variable, see docs/releasing.md"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Prepended so codesign finds the identity, without dropping the login keychain from the list.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          {
            echo "SIGNING_IDENTITY=Developer ID Application"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Write the notary API key
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          OUTPUT_DIR: ${{ runner.temp }}/out
        run: |
          dmg="$(./scripts/build-dmg.sh "$VERSION" "$BUILD" | tail -n 1)"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          if [[ -n "${NOTARY_KEY_PATH:-}" ]]; then
            signed="Developer ID, notarized"
          elif [[ -n "${SIGNING_IDENTITY:-}" ]]; then
            signed="Developer ID, not notarized"
          else
            signed="ad-hoc. macOS will block the first launch, see docs/releasing.md"
            echo "::warning::The DMG is signed ad-hoc because the Developer ID secrets are not set."
          fi
          echo "Built \`$(basename "$dmg")\` ($signed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the DMG to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$DMG" --clobber

      - name: Sign the update for Sparkle
        if: github.event_name == 'release' && env.PUBLISH_APPCAST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED: ${{ github.event.release.published_at }}
        run: |
          # build-dmg.sh resolves packages into its own DerivedData, which is where Sparkle's
          # command line tools end up.
          sign_update=".build/dmg-derived/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          signature="$(echo "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "$DMG")"

          # Everything pages.yml needs to list this release in the appcast. Kept on the release
          # because each Pages deploy rebuilds the feed from scratch.
          item="$RUNNER_TEMP/appcast-item.json"
          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$DMG")" \
            --arg length "$(stat -f %z "$DMG")" \
            --arg signature "$signature" \
            --arg minimumSystemVersion "$MINIMUM_SYSTEM_VERSION" \
            --arg channel "$CHANNEL" \
            --arg published "$PUBLISHED" \
            '$ARGS.named' > "$item"
          gh release upload "$TAG" "$item" --clobber

      - name: Upload the DMG as an artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Archipel-${{ env.VERSION }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Clean up the signing keychain
        if: always() && env.HAS_DEVELOPER_ID == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  appcast:
    needs: dmg
    if: github.event_name == 'release' && needs.dmg.outputs.publish-appcast == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
