name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Same image as the release workflow; the macos-26 images can't build for macOS 27.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Test ArchipelKit
        working-directory: Packages/ArchipelKit
        run: swift test

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # Shares its key with the release workflow, so a release usually starts with a warm cache.
      - name: Cache GhosttyKit
        id: ghostty-cache
        uses: actions/cache@v6
        with:
          path: |
            Packages/TerminalKit/Frameworks
            Vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-xcode-27.2-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Build GhosttyKit
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      # Configs/Signing.xcconfig signs ad-hoc by default, so this needs no secrets and works for forks.
      - name: Build the app
        run: |
          xcodebuild build \
            -project Archipel.xcodeproj \
            -scheme Archipel \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/ci-derived \
            -quiet
