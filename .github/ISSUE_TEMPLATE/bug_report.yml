name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a project
        2. Start a Claude session in a new worktree
        3. ...
  - type: input
    id: version
    attributes:
      label: Archipel version
      description: Archipel > About Archipel. Say if you built it from source.
      placeholder: 0.3.0-beta.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.1"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options:
        - Claude Code
        - Codex
        - Shell
        - Not agent related
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps, such as a screenshot, a crash report or Console output.
