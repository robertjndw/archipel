name: Feature request
description: An idea for something Archipel should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the problem or workflow, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to see
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
